name: quake_flutter
description: "Quake — real-time earthquake tracking, powered by USGS data."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # State management (ChangeNotifier-based, closest match to iOS ObservableObject)
  provider: ^6.1.2

  # Local persistence (mirrors UserDefaults)
  shared_preferences: ^2.2.3

  # Map (no API key required, mirrors MapKit usage)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location permissions (mirrors CLLocationManager)
  geolocator: ^12.0.0

  # Date formatting
  intl: ^0.19.0

  # Feedback: image attachment + native share sheet (mirrors ImagePicker + MailView)
  image_picker: ^1.1.2
  share_plus: ^7.2.2

  # Opening external links / settings / mailto (mirrors CustomLink + Settings deep link)
  url_launcher: ^6.3.0

  # App name/version/build (mirrors Bundle.main.infoDictionary in FeedbackView)
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/earthquake_map_pin.png
